name: AppSec Dashboard Continuous Integration
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appsec_user
          POSTGRES_PASSWORD: appsec_password
          POSTGRES_DB: appsec_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appsec_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://appsec_user:appsec_password@localhost:5432/appsec_dashboard
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Apply database schema
        run: npm run db:push
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Typecheck (server only)
        run: npm run check:server
      - name: Run tests
        run: npm test