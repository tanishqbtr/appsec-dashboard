version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: appsec-postgres-dev
    environment:
      POSTGRES_USER: appsec_user
      POSTGRES_PASSWORD: appsec_password
      POSTGRES_DB: appsec_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - appsec-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec_user -d appsec_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development Application (with hot reload)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: appsec-dashboard-dev
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://appsec_user:appsec_password@postgres:5432/appsec_dashboard
      - SESSION_SECRET=dev-secret-key
      - SEED=1
      - ADMIN_SEED_PASSWORD=ChangeMe!
      - DEMO_SEED_PASSWORD=ChangeMeDemo!123
    ports:
      - "3000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appsec-network
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -lc "npm run db:push && npm run dev"

volumes:
  postgres_dev_data:

networks:
  appsec-network:
    driver: bridge